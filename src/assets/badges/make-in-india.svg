<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <defs>
    <linearGradient id="miiDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2438" />
      <stop offset="100%" stop-color="#071522" />
    </linearGradient>
    <linearGradient id="miiOrangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ee7d1f" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Mechanical Cogwheel Gear Lion Silhouette Group -->
  <g transform="translate(15, 20) scale(0.95)">
    <!-- Lion Head & Mane with Gears -->
    <path d="M 40 45 C 45 25 65 15 85 20 C 95 10 115 10 125 22 C 140 15 160 25 165 40 C 175 42 185 55 180 70 C 188 80 185 95 175 105 C 180 115 172 130 158 135 C 150 145 135 148 122 142 C 110 150 90 148 80 138 C 70 142 55 135 50 125 C 38 125 30 112 32 100 C 22 92 22 75 30 65 C 28 52 35 45 40 45 Z" fill="#0f2438" />
    
    <!-- Torso / Midsection composed of interlocking gear plates -->
    <path d="M 155 45 C 190 40 230 42 270 48 C 300 52 330 62 355 75 C 370 82 390 95 405 110 C 390 115 375 112 360 108 C 340 102 315 95 290 94 C 265 92 235 95 210 98 C 185 102 165 110 150 118 Z" fill="#0f2438" />

    <!-- Forelegs & Claws (Mechanical Piston & Joint styling) -->
    <path d="M 95 130 L 105 180 L 125 180 L 128 155 L 142 155 L 145 180 L 165 180 L 160 125 Z" fill="#0f2438" />
    <path d="M 175 115 L 188 175 L 205 175 L 202 140 L 215 140 L 220 175 L 238 175 L 230 105 Z" fill="#0f2438" />

    <!-- Hindquarters & Back Legs (Articulated Robotic/Gear joints) -->
    <path d="M 330 80 C 350 90 370 110 380 135 L 395 180 L 375 180 L 365 150 L 350 150 L 345 180 L 325 180 C 325 150 315 130 300 115 Z" fill="#0f2438" />
    <path d="M 400 120 C 420 135 435 155 440 180 L 420 180 L 412 160 L 400 160 L 395 180 L 380 180 C 385 155 390 135 400 120 Z" fill="#0f2438" />

    <!-- Tail with gear tuft -->
    <path d="M 390 95 C 420 85 450 90 465 110 C 475 125 468 140 455 142 C 445 145 440 135 445 125 C 448 118 440 110 425 112 C 410 115 398 118 385 110 Z" fill="#0f2438" />

    <!-- Gear Teeth & Cutouts inside Mane & Body (Negative space & orange mechanical accents) -->
    <circle cx="85" cy="75" r="22" fill="#ffffff" />
    <circle cx="85" cy="75" r="14" fill="#ee7d1f" />
    <circle cx="85" cy="75" r="6" fill="#ffffff" />
    
    <!-- Gear 2 (Chest) -->
    <circle cx="135" cy="90" r="16" fill="#ffffff" />
    <circle cx="135" cy="90" r="10" fill="#0f2438" />
    <circle cx="135" cy="90" r="4" fill="#ee7d1f" />

    <!-- Gear 3 (Mid Torso) -->
    <circle cx="210" cy="72" r="18" fill="#ffffff" />
    <circle cx="210" cy="72" r="11" fill="#ee7d1f" />
    <circle cx="210" cy="72" r="5" fill="#0f2438" />

    <!-- Gear 4 (Flank) -->
    <circle cx="280" cy="74" r="15" fill="#ffffff" />
    <circle cx="280" cy="74" r="9" fill="#0f2438" />
    <circle cx="280" cy="74" r="4" fill="#ee7d1f" />

    <!-- Gear 5 (Haunch) -->
    <circle cx="345" cy="115" r="20" fill="#ffffff" />
    <circle cx="345" cy="115" r="12" fill="#ee7d1f" />
    <circle cx="345" cy="115" r="5" fill="#ffffff" />

    <!-- Mechanical Cutout Slots along spine -->
    <rect x="170" y="54" width="18" height="6" rx="3" fill="#ffffff" transform="rotate(-10 170 54)" />
    <rect x="235" y="58" width="22" height="6" rx="3" fill="#ffffff" transform="rotate(5 235 58)" />
    <rect x="305" y="68" width="20" height="6" rx="3" fill="#ffffff" transform="rotate(18 305 68)" />
    
    <!-- Piston Slots on Legs -->
    <rect x="108" y="140" width="6" height="25" rx="3" fill="#ffffff" />
    <rect x="188" y="130" width="6" height="25" rx="3" fill="#ffffff" />
    <rect x="365" y="135" width="6" height="25" rx="3" fill="#ffffff" />
  </g>

  <!-- MAKE IN INDIA Typography (Bold Technical Sans) -->
  <text x="250" y="185" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="24" fill="#0f2438" letter-spacing="9">MAKE IN INDIA</text>
</svg>