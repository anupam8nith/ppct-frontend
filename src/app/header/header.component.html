<div class="topbar">
  <div class="wrap">
    <div class="topbar-left">
      <app-icon name="map-pin" [size]="14"></app-icon>
      <span>{{ business.addressLine }}</span>
      <a href="assets/docs/pp-cooling-towers-qms.pdf" target="_blank" class="iso-top-pill" title="View ISO 9001:2015 QMS Certificate (PDF)">
        <app-icon name="shield" [size]="11"></app-icon> ISO 9001:2015 Certified
      </a>
    </div>
    <div class="topbar-right">
      <a [href]="'mailto:' + business.email">
        <app-icon name="mail" [size]="13"></app-icon>
        {{ business.email }}
      </a>
      <a [href]="'tel:+91' + business.mobile">
        <app-icon name="phone" [size]="13"></app-icon>
        {{ business.mobileDisplay }}
      </a>
    </div>
  </div>
</div>

<header class="site">
  <div class="wrap">
    <a routerLink="/home" class="brand" (click)="closeMobile()">
      <img src="assets/logo.png" alt="P.P. Cooling Towers logo" />
      <div class="brand-text">
        <div class="name">P.P. COOLING TOWERS</div>
        <div class="tag">Manufacture &middot; Repair &middot; Maintenance</div>
      </div>
    </a>

    <nav class="main" [class.open]="mobileOpen">
      <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMobile()">Home</a>
      <a routerLink="/about" routerLinkActive="active" (click)="closeMobile()">About</a>
      <a routerLink="/products" routerLinkActive="active" (click)="closeMobile()">Products</a>
      <a routerLink="/home" fragment="gallery" (click)="closeMobile()">Gallery</a>
      <a routerLink="/precious-clients" routerLinkActive="active" (click)="closeMobile()">Clients</a>
      <a routerLink="/contact" routerLinkActive="active" (click)="closeMobile()">Contact</a>

      <div class="mobile-actions">
        <a class="btn btn-navy-outline btn-sm" [href]="whatsappHref" target="_blank" rel="noopener">
          <app-icon name="whatsapp" [size]="16"></app-icon> WhatsApp
        </a>
        <a routerLink="/contact" class="btn btn-amber btn-sm" (click)="closeMobile()">Request a Quote</a>
      </div>
    </nav>

    <div class="header-actions">
      <a class="icon-cta" [href]="'mailto:' + business.email" title="Email us" aria-label="Email us">
        <app-icon name="mail" [size]="16"></app-icon>
      </a>
      <a class="phone-cta" [href]="'tel:+91' + business.mobile">
        <span class="ico"><app-icon name="phone" [size]="15"></app-icon></span>
        {{ business.mobileDisplay }}
      </a>
      <a routerLink="/contact" class="btn btn-amber">Request a Quote</a>
    </div>

    <button class="menu-toggle" type="button" (click)="toggleMobile()" [attr.aria-expanded]="mobileOpen" aria-label="Toggle menu">
      <app-icon [name]="mobileOpen ? 'close' : 'menu'" [size]="22"></app-icon>
    </button>
  </div>
</header>
