name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            npx firebase-tools deploy --only hosting --project ppcoolingtowersforyou --token "$FIREBASE_TOKEN"
          else
            echo "FIREBASE_TOKEN secret is not set. Please add FIREBASE_TOKEN in GitHub repository secrets (Settings > Secrets and variables > Actions)."
            exit 1
          fi
